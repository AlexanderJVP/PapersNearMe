name: Deploy web app

# Publishes web/ plus the latest paper index to GitHub Pages. Browsers can't download
# release assets directly (no CORS headers), so the index is served from the site itself.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Nightly paper index"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          cp -r web/. site/
          gh release download index-latest -D site/data -p manifest.json \
            -p 'papers-*.jsonl.gz' -p 'vectors-*.bin' -p model.onnx -p vocab.txt
          touch site/.nojekyll
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
